services:
  candronex.host:
    image: ${DOCKER_REGISTRY-}candronexhost
    build:
      context: .
      dockerfile: CanDroneX.Host/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__CanDroneX=Host=postgres;Port=5432;Database=candronex;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - candronex

  postgres:
    image: postgres:16-alpine
    container_name: candronex-postgres
    environment:
      POSTGRES_DB: candronex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./CanDroneX.Host/scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d candronex"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - candronex

networks:
  candronex:

volumes:
  pgdata: